contract = 1

[game]
id      = "aoe4"
name    = "Age of Empires IV"
status  = "rc"
summary = "Flat 60 on M1 Pro and M5 Air, open engine, no CrossOver at runtime"

notes = """
Own Wine engine (LGPL source + the AoE IV Rosetta patch + our relocator diff) and
x87sidecar. Setup installs Steam into a fresh prefix and links the game files from
~/Games/*/steamapps if it finds them (or clones a prefix named in AOE4_BOTTLE). Flat 60 on an M1 Pro 16 GB and an M5 Air;
keep Fullscreen Desktop, close the browser on 16 GB, and plug in. Online 2v2 between
two Macs works on this pack; against humans it is untested.
"""

[source]
kind    = "release"
url     = "https://github.com/NerRobDog/dxmt-aoe4-pack/releases/download/v0.3.1/dxmt-aoe4-pack-v0.3.1.tar.gz"
sha256  = "7162664720ff124ad1815449113ed827ca55f8a7b7875f4205bd7d17597ab125"
size    = 135144676
version = "v0.3.1"

[requires]
arch    = "arm64"
macos   = ">=26"
rosetta = true
disk_gb = 4

[install]
home_authoritative = true
foreign_note = "writes outside the home: the game profile in Documents (.bak kept)"

[paths]
profile = "README-local.txt"
logs    = "logs"

[commands]
preflight    = "bash setup.sh --preflight"
install      = "bash setup.sh"
launch       = "aoe4.sh"
launch_plain = "aoe4.sh --plain"
uninstall    = "bash uninstall.sh"
