contract = 1

[game]
id      = "aoe4"
name    = "Age of Empires IV"
status  = "rc"
summary = "Flat 60 on M1 Pro and M5 Air, open engine, no CrossOver at runtime"

notes = """
Own Wine engine (LGPL source + the AoE IV Rosetta patch + our relocator diff) and
x87sidecar. Setup clones an existing CrossOver bottle if it finds one, or installs
Steam into a fresh prefix if it does not. Flat 60 on an M1 Pro 16 GB and an M5 Air;
keep Fullscreen Desktop, close the browser on 16 GB, and plug in. Online 2v2 between
two Macs works on this pack; against humans it is untested.
"""

[source]
kind    = "release"
url     = "https://github.com/NerRobDog/dxmt-aoe4-pack-dev/releases/download/v0.2/dxmt-aoe4-pack-v0.2.tar.gz"
sha256  = "ed978e077fddea033f067799327200db9bb9402423a7fe7dd7897267f35c2691"
size    = 136061249
version = "v0.2"

[requires]
arch    = "arm64"
macos   = ">=26"
rosetta = true
disk_gb = 4

[install]
home_authoritative = true
foreign_note = "writes outside the home: your CrossOver bottle (clone mode) and the game profile in Documents (.bak kept)"

[paths]
profile = "README-local.txt"
logs    = "logs"

[commands]
preflight    = "bash setup.sh --preflight"
install      = "bash setup.sh"
launch       = "aoe4.sh"
launch_plain = "aoe4.sh --plain"
uninstall    = "bash uninstall.sh"
