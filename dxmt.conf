# dxmt-aoe4-pack — reference for the DXMT options this pack uses.
#
# You normally do NOT edit this file: aoe4.sh generates $DEST/dxmt.generated.conf
# from $DEST/aoe4.conf on every launch. For advanced DXMT options create
# $DEST/dxmt.extra.conf — its lines are appended verbatim.
#
# What the generated file contains:
#   dxgi.customVendorId = 10de / customDeviceId = 2484 / customDeviceDesc = NVIDIA GeForce RTX 3070
#       MANDATORY vendor spoof: the game refuses Apple's GPU vendor id (0x106B).
#   d3d12.preferredMaxFrameRate = <pace>   (from aoe4.conf: pace)
#   d3d12.cpuPacing = True                  pacing on the app thread — flattest frametime of
#       every mode measured; keep the in-game V-Sync OFF and Framerate Limit Unlimited
#       (setup.sh writes both into the game's profile). Without cpuPacing the rate must be
#       a divisor of the panel refresh (50 on 60 Hz collapses to 30 fps).
#   d3d12.metalSpatialUpscaleFactor = <metalfx>   (only when metalfx != 0)
#
# Examples for dxmt.extra.conf:
#   d3d12.cpuPacing = False        # old presentDrawableAfterMinimumDuration pacing
